# One command for local development:   docker compose up --build
# One command for the full test suite: ./test.sh
#
# Development services: database -> migrate (runs once) -> api -> frontend
# Test services (only with --profile test) use a separate, throwaway database.

x-db-settings: &db
  POSTGRES_USER: appuser
  POSTGRES_PASSWORD: apppassword
  POSTGRES_DB: database

services:
  database:
    image: postgres:18
    environment: *db
    ports:
      - "${DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d database"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Applies migrations and creates the local test accounts, then exits.
  migrate:
    build: ./backend
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *db
      DB_HOST: database
      DB_PORT: 5432
    command: ["sh", "-c", "npm run migrate && npm run query"]

  api:
    build: ./backend
    command: ["npm", "run", "dev"]
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      <<: *db
      DB_HOST: database
      DB_PORT: 5432
      NODE_ENV: development
      ENABLE_TEST_LOGIN: ${ENABLE_TEST_LOGIN:-true}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_ENABLE_TEST_LOGIN: ${VITE_ENABLE_TEST_LOGIN:-true}
      VITE_USE_POLLING: "true"
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # ---------- Tests (only started by ./test.sh or --profile test) ----------

  test-database:
    profiles: ["test"]
    image: postgres:18
    environment: *db
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d database"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend-test:
    profiles: ["test"]
    build: ./backend
    depends_on:
      test-database:
        condition: service_healthy
    environment:
      <<: *db
      DB_HOST: test-database
      DB_PORT: 5432
    command: ["sh", "-c", "npm run migrate && npm test"]

  frontend-test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    command: ["sh", "-c", "npm run lint && npm test && npm run build"]

volumes:
  postgres_data: